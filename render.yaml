services:
  - type: web
    name: peprna-db
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: gunicorn rnadb.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: peprna-db.onrender.com,peprna-db.se,www.peprna-db.se
      - key: CSRF_TRUSTED_ORIGINS
        value: https://peprna-db.onrender.com,https://peprna-db.se,https://www.peprna-db.se
      - key: DATABASE_URL
        fromDatabase:
          name: peprna-db-postgres
          property: connectionString

databases:
  - name: peprna-db-postgres
    plan: basic-256mb
