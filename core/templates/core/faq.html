<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>FAQ</title>
</head>
<body>
    <h1>Frequently asked questions</h1>
    <p>
        <a href="{% url 'home' %}">Home</a> |
        <a href="{% url 'browse' %}">Browse</a> |
        <a href="{% url 'downloads' %}">Downloads</a> |
        <a href="{% url 'help' %}">Help</a> |
        <a href="{% url 'about' %}">About</a> |
        <a href="{% url 'contact' %}">Contact</a>
    </p>

    {% for item in faqs %}
        <h2>{{ item.question }}</h2>
        <p>{{ item.answer }}</p>
    {% endfor %}

    <p>The FAQ content is loaded from a local JSON file so it can be edited without changing Python code.</p>
</body>
</html>
